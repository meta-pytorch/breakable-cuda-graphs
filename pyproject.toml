[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "breakable_cuda_graphs"
version = "0.1.0"
description = "Breakable CUDA graphs for PyTorch"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "Meta Platforms, Inc."},
]
keywords = ["pytorch", "torch", "cuda", "cuda-graphs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "torch",
]

[project.urls]
Homepage = "https://github.com/meta-pytorch/breakable-cuda-graphs"
Repository = "https://github.com/meta-pytorch/breakable-cuda-graphs"
Issues = "https://github.com/meta-pytorch/breakable-cuda-graphs/issues"

[tool.setuptools]
py-modules = ["breakable_cuda_graphs"]
packages = []

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"
